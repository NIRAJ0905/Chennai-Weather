<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chennai Weather</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-container">

        <h1>Chennai Weather</h1>

        <p class="location">Chennai, Tamil Nadu</p>

        <div class="weather-card">

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="condition">Checking weather...</p>

            <div class="weather-info">

                <div>
                    <p>Humidity</p>
                    <h3><span id="humidity">--</span>%</h3>
                </div>

                <div>
                    <p>Wind Speed</p>
                    <h3><span id="wind">--</span> km/h</h3>
                </div>

            </div>

        </div>

        <p id="status">Loading weather...</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
